# /etc/NetworkManager/conf.d/99-skytrack-unmanaged.conf
#
# Tell NetworkManager to keep its hands off wlan0 so hostapd / dnsmasq /
# dhcpcd own it. Installed by scripts/hotspot_apply.sh on systems where
# NetworkManager is present.
#
# Reapply with:
#   sudo systemctl restart NetworkManager

[keyfile]
unmanaged-devices=interface-name:wlan0
