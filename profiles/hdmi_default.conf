# =============================================================================
# SkyTrack LCD Profile: hdmi_default
# Safe defaults for standard HDMI monitors — no overlays needed.
# =============================================================================
#
# This profile does NOT modify /boot/firmware/config.txt.
# It serves as documentation of the default HDMI configuration.
#
# For custom LCD panels (e.g., Waveshare, Elecrow, GeeekPi), create a new
# profile in this directory with the required dtoverlay/hdmi_* settings.
#
# Usage:
#   sudo ./install.sh --lcd-profile hdmi_default
#
# Example custom profile (profiles/waveshare_5inch.conf):
#   dtoverlay=vc4-kms-dpi-generic
#   hdmi_group=2
#   hdmi_mode=87
#   hdmi_cvt=800 480 60 6 0 0 0
#
# The installer will append these lines to /boot/firmware/config.txt
# after creating a backup.

# No modifications required for standard HDMI.
