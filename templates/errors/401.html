{% extends 'base.html' %}
{% block title %}Sign in required{% endblock %}
{% block body_class %}error{% endblock %}

{% block content %}
<section class="error-shell">
  <h1>401</h1>
  <p>This page is admin-only. Sign in to continue, or head back to the public dashboard.</p>
  <p>
    <button type="button" class="btn primary" data-auth-trigger="admin">Sign in</button>
    <a class="btn" href="{{ url_for('dashboard.index') }}">Dashboard</a>
  </p>
</section>
{% endblock %}
