{% extends 'base.html' %}
{% block title %}Logs{% endblock %}
{% block body_class %}logs{% endblock %}

{% block content %}
<section class="settings">
  <header class="settings-header">
    <h1>Logs</h1>
    <span class="muted">portal • network • application</span>
  </header>

  <nav class="tablist" id="logs-tablist">
    <button class="tab active" data-tab="portal">Portal</button>
    <button class="tab" data-tab="network">Network</button>
    <button class="tab" data-tab="app">Application</button>
  </nav>

  <div class="tabpanels">
    <section class="tabpanel active" data-tabpanel="portal">
      <pre class="log-pre" id="log-portal">loading…</pre>
    </section>
    <section class="tabpanel" data-tabpanel="network">
      <pre class="log-pre" id="log-network">loading…</pre>
    </section>
    <section class="tabpanel" data-tabpanel="app">
      <pre class="log-pre" id="log-app">loading… (admin only)</pre>
    </section>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/logs.js') }}" defer></script>
{% endblock %}
