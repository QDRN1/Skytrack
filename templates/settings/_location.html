{# Settings → Location #}
<section class="settings-section" data-section-pane="location">

  <div class="settings-card">
    <header class="card-header">
      <h2>Location</h2>
      <p class="muted">Controls where the map centers and which weather station is used.</p>
    </header>

    <div class="card-body card-form" id="location-card">
      <div class="field">
        <label>Source</label>
        <div class="segmented" role="radiogroup" aria-label="Location source">
          <label class="seg"><input type="radio" name="location_source" value="gps"
                 id="loc-src-gps"
                 {% if (config.location_source or 'gps') == 'gps' %}checked{% endif %}><span>GPS (auto)</span></label>
          <label class="seg"><input type="radio" name="location_source" value="manual"
                 id="loc-src-manual"
                 {% if config.location_source == 'manual' %}checked{% endif %}><span>Manual</span></label>
        </div>
      </div>

      <div class="field" id="loc-gps-status">
        <label>GPS status</label>
        <div class="readonly-grid">
          <div class="readonly-row">
            <span class="ro-label">Fix</span>
            <code class="ro-value" id="loc-gps-state">checking…</code>
          </div>
          <div class="readonly-row">
            <span class="ro-label">Source</span>
            <code class="ro-value" id="loc-gps-source">—</code>
          </div>
          <div class="readonly-row">
            <span class="ro-label">Coordinates</span>
            <code class="ro-value" id="loc-gps-coords">—</code>
          </div>
        </div>
      </div>

      <div class="field" id="loc-manual-group" {% if (config.location_source or 'gps') != 'manual' %}hidden{% endif %}>
        <label for="loc-address">Address</label>
        <div style="display:flex;gap:8px;align-items:flex-start">
          <input type="text" id="loc-address" class="input"
                 placeholder="123 Main St, Bay City, WI 54723"
                 value="{{ config.location_address or '' }}"
                 style="flex:1">
          <button type="button" class="btn btn-lg btn-primary" id="loc-geocode-btn">Look up</button>
        </div>
        <p class="muted small" id="loc-geocode-status">&nbsp;</p>
      </div>

      <div class="field" id="loc-coords-group" {% if (config.location_source or 'gps') != 'manual' %}hidden{% endif %}>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <label for="loc-lat">Latitude</label>
            <input type="number" step="any" id="loc-lat" name="latitude" class="input"
                   value="{{ config.latitude }}">
          </div>
          <div>
            <label for="loc-lon">Longitude</label>
            <input type="number" step="any" id="loc-lon" name="longitude" class="input"
                   value="{{ config.longitude }}">
          </div>
        </div>
      </div>

      <footer class="card-footer">
        <button type="button" class="btn btn-lg" id="loc-cancel">Cancel</button>
        <button type="button" class="btn btn-lg btn-primary" id="loc-save">Save Location</button>
      </footer>
    </div>
  </div>

<script>
(function () {
  // ---- Location source toggle ----
  document.querySelectorAll('[name="location_source"]').forEach(function (r) {
    r.addEventListener('change', function () {
      var manual = this.value === 'manual';
      var mg = document.getElementById('loc-manual-group');
      var cg = document.getElementById('loc-coords-group');
      var gs = document.getElementById('loc-gps-status');
      if (mg) mg.hidden = !manual;
      if (cg) cg.hidden = !manual;
      if (gs) gs.hidden = manual;
    });
  });
  // Apply initial state
  var srcRadio = document.querySelector('[name="location_source"]:checked');
  if (srcRadio) {
    var manual = srcRadio.value === 'manual';
    var gs = document.getElementById('loc-gps-status');
    if (gs) gs.hidden = manual;
  }

  // ---- GPS status poll ----
  function pollGps() {
    fetch('/api/settings/location', {
      credentials: 'same-origin',
      headers: { Accept: 'application/json' },
    }).then(function (r) { return r.json(); }).then(function (d) {
      var g = d.gps || {};
      var el = document.getElementById('loc-gps-state');
      if (el) el.textContent = g.state || 'no_fix';
      var src = document.getElementById('loc-gps-source');
      if (src) src.textContent = g.source || '—';
      var coords = document.getElementById('loc-gps-coords');
      if (coords && g.lat && g.lon) {
        coords.textContent = Number(g.lat).toFixed(5) + ', ' + Number(g.lon).toFixed(5);
      }
    }).catch(function () {});
  }
  pollGps();
  setInterval(pollGps, 10000);

  // ---- Geocode ----
  var geocodeBtn = document.getElementById('loc-geocode-btn');
  var geocodeStatus = document.getElementById('loc-geocode-status');
  if (geocodeBtn) geocodeBtn.addEventListener('click', function () {
    var addr = (document.getElementById('loc-address') || {}).value || '';
    if (!addr.trim()) return;
    geocodeBtn.disabled = true;
    if (geocodeStatus) geocodeStatus.textContent = 'Looking up…';
    fetch('/api/settings/location/geocode', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ address: addr }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      geocodeBtn.disabled = false;
      if (d.ok === false) {
        if (geocodeStatus) geocodeStatus.textContent = d.error || 'Failed';
        return;
      }
      var lat = document.getElementById('loc-lat');
      var lon = document.getElementById('loc-lon');
      if (lat) lat.value = d.lat;
      if (lon) lon.value = d.lon;
      if (geocodeStatus) geocodeStatus.textContent = d.display_name || 'Found';
    }).catch(function (e) {
      geocodeBtn.disabled = false;
      if (geocodeStatus) geocodeStatus.textContent = 'Error: ' + e.message;
    });
  });

  // ---- Save location ----
  var locSave = document.getElementById('loc-save');
  if (locSave) locSave.addEventListener('click', function () {
    var src = (document.querySelector('[name="location_source"]:checked') || {}).value || 'gps';
    var payload = { location_source: src };
    if (src === 'manual') {
      payload.latitude = parseFloat((document.getElementById('loc-lat') || {}).value);
      payload.longitude = parseFloat((document.getElementById('loc-lon') || {}).value);
      payload.location_address = (document.getElementById('loc-address') || {}).value || '';
    }
    fetch('/api/settings/location', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(payload),
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok === false) alert(d.error || 'Save failed');
    }).catch(function () {});
  });
})();
</script>

</section>
