{# Settings → Location #}
<section class="settings-section" data-section-pane="location">

  <div class="settings-card">
    <header class="card-header">
      <h2>Location</h2>
      <p class="muted">Controls where the map centers and which weather station is used.</p>
    </header>

    <div class="card-body card-form" id="location-card">
      <div class="field">
        <label>Source</label>
        <div class="segmented" role="radiogroup" aria-label="Location source">
          <label class="seg"><input type="radio" name="location_source" value="gps"
                 id="loc-src-gps"
                 {% if (config.location_source or 'gps') == 'gps' %}checked{% endif %}><span>GPS (auto)</span></label>
          <label class="seg"><input type="radio" name="location_source" value="manual"
                 id="loc-src-manual"
                 {% if config.location_source == 'manual' %}checked{% endif %}><span>Manual</span></label>
        </div>
      </div>

      <div class="field" id="loc-gps-status">
        <label>GPS status</label>
        <div class="readonly-grid">
          <div class="readonly-row">
            <span class="ro-label">Fix</span>
            <code class="ro-value" id="loc-gps-state">checking…</code>
          </div>
          <div class="readonly-row">
            <span class="ro-label">Source</span>
            <code class="ro-value" id="loc-gps-source">—</code>
          </div>
          <div class="readonly-row">
            <span class="ro-label">Coordinates</span>
            <code class="ro-value" id="loc-gps-coords">—</code>
          </div>
        </div>
      </div>

      <div class="field" id="loc-manual-group" {% if (config.location_source or 'gps') != 'manual' %}hidden{% endif %}>
        <label for="loc-address">Address</label>
        <div style="display:flex;gap:8px;align-items:flex-start">
          <input type="text" id="loc-address" class="input"
                 placeholder="100 S 1st St, Minneapolis, MN 55401"
                 value="{{ config.location_address or '' }}"
                 style="flex:1">
          <button type="button" class="btn btn-lg btn-primary" id="loc-geocode-btn">Look up</button>
        </div>
        <p class="muted small" id="loc-geocode-status">&nbsp;</p>
      </div>

      <div class="field" id="loc-coords-group" {% if (config.location_source or 'gps') != 'manual' %}hidden{% endif %}>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <label for="loc-lat">Latitude</label>
            <input type="number" step="any" id="loc-lat" name="latitude" class="input"
                   value="{{ config.latitude }}">
          </div>
          <div>
            <label for="loc-lon">Longitude</label>
            <input type="number" step="any" id="loc-lon" name="longitude" class="input"
                   value="{{ config.longitude }}">
          </div>
        </div>
      </div>

      <footer class="card-footer">
        <button type="button" class="btn btn-lg" id="loc-cancel">Cancel</button>
        <button type="button" class="btn btn-lg btn-primary" id="loc-save">Save Location</button>
      </footer>
    </div>
  </div>


</section>
