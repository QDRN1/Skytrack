<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>SkyTrack</title>
  <!--
    SkyTrack appliance splash.

    Loaded by Chromium from file:// BEFORE skytrack-app is listening. Its
    job is deliberately small: paint something branded while the backend
    comes up, then hand off to /kiosk the moment /healthz answers. The
    /kiosk route owns the entire onboarding experience (boot_video,
    setup_video, pin_required, pin_confirm, setup_offer,
    setup_now_hotspot, operational) via /api/onboarding/state, so the
    splash must NOT try to second-guess configuration state.

    States
    ------
      boot         — SkyTrack Boot Screen-V1.mp4
                     default on cold start; shown while /healthz has not
                     yet returned a 2xx response.

      unavailable  — SkyTrack Service Unavail.mp4
                     /healthz has been unreachable for UNAVAILABLE_MS, or
                     kiosk.js bounced us here with ?from=kiosk (runtime
                     backend crash). Also keeps polling so we auto-recover.

    (The 'setup' video element is still declared below so the installer
    doesn't have to ship a special cold-boot asset list, but the splash
    never switches to it — the kiosk plays the setup explainer itself
    as part of the setup_video onboarding stage.)

    Device-ID pill
    --------------
    Populated by device_id.js which install.sh writes next to this file.
    If that script is missing (bad OTA) the placeholder "SkyTrack" stays
    in place — we never render an empty pill.

    Emergency fallback
    ------------------
    A hidden center card (brand + spinner + one-line status) is attached
    to the error/sourceerror events of each <video>. It only ever becomes
    visible if the current state's video can't decode. When it does, it
    sits on the static dark branded gradient (#bg-fallback). It is NOT
    an overlay on top of a working video.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #05070b;
      color: #e6ecf2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body { cursor: none; }

    /* Last-resort branded gradient behind ALL videos. If every video fails
       to decode, this plus the fallback card is what the operator sees. */
    #bg-fallback {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(46,108,246,0.28), transparent 60%),
        radial-gradient(ellipse at 78% 80%, rgba(242,145,53,0.18), transparent 60%),
        linear-gradient(180deg, #05070b 0%, #02040e 100%);
    }

    /* Full-bleed video layer. Three <video> elements are stacked; exactly
       one is made visible at a time via the .visible class. object-fit
       cover gives true fullscreen regardless of the source aspect. */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #05070b;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 400ms ease;
    }
    .bg-video.visible { opacity: 1; }

    /* Device-ID pill — the ONLY thing drawn on top of a working video.
       Matches kiosk.html's .kiosk-device-id-pill so the visual identity
       is consistent between splash and the backend-rendered kiosk page. */
    .device-overlay {
      position: fixed;
      top: 6vh;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 20;
      pointer-events: none;
    }
    .device-pill {
      display: inline-block;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 12px 28px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: clamp(1.1em, 2.4vh, 1.7em);
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.85);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    /* Emergency fallback card — HIDDEN until revealed by JS.
       Revealed only when the current state's <video> can't decode. */
    .fallback-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      max-width: 720px;
      padding: 0 32px;
      pointer-events: none;
      display: none;
    }
    .fallback-card.visible { display: block; }
    .brand {
      font-size: 54px;
      font-weight: 300;
      letter-spacing: 0.22em;
      margin: 0 0 12px 0;
      text-transform: uppercase;
      color: #e6ecf2;
    }
    .brand strong {
      font-weight: 600;
      color: #7ec8ff;
    }
    .tag {
      font-size: 16px;
      letter-spacing: 0.16em;
      color: #8aa0b8;
      text-transform: uppercase;
      margin: 0 0 40px 0;
    }
    .spinner {
      display: inline-block;
      width: 56px; height: 56px;
      border: 4px solid rgba(126, 200, 255, 0.18);
      border-top-color: #7ec8ff;
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
      margin: 12px 0 24px 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg {
      font-size: 20px;
      color: #c2cedb;
      margin: 0;
      line-height: 1.5;
    }
    .msg.small {
      font-size: 14px;
      color: #6f8397;
      margin-top: 12px;
      letter-spacing: 0.04em;
    }

    /* Version tag — small, bottom-right, barely visible. Populated by JS. */
    .version-tag {
      position: fixed;
      right: 14px;
      bottom: 10px;
      z-index: 25;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 1.2px;
      color: rgba(255, 255, 255, 0.35);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.75);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Last-resort branded background, never animated, behind everything -->
  <div id="bg-fallback"></div>

  <!-- Boot video — configured device, cold boot -->
  <video id="video-boot" class="bg-video"
         autoplay muted loop playsinline preload="auto">
    <source src="file:///opt/skytrack/static/video/SkyTrack%20Boot%20Screen-V1.mp4" type="video/mp4">
  </video>

  <!-- Setup video — unconfigured device (/healthz returned configured=false) -->
  <video id="video-setup" class="bg-video"
         autoplay muted loop playsinline preload="auto">
    <source src="file:///opt/skytrack/static/video/SkyTrack%20Setup%20Screen.mp4" type="video/mp4">
  </video>

  <!-- Service-unavailable video — /healthz down for >60s or ?from=kiosk -->
  <video id="video-unavailable" class="bg-video"
         autoplay muted loop playsinline preload="auto">
    <source src="file:///opt/skytrack/static/video/SkyTrack%20Service%20Unavail.mp4" type="video/mp4">
  </video>

  <!-- Device-ID pill — always visible, populated by device_id.js -->
  <div class="device-overlay">
    <span class="device-pill" id="device-pill">
      <span id="device-pill-text">SkyTrack</span>
    </span>
  </div>

  <!-- Emergency fallback card — hidden unless the active video fails -->
  <div class="fallback-card" id="fallback-card">
    <h1 class="brand">Sky<strong>Track</strong></h1>
    <p class="tag">ADS-B Tracker · QDRN</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="msg" id="fallback-msg">Starting services&hellip;</p>
    <p class="msg small" id="fallback-detail">Initializing</p>
  </div>

  <!-- Version tag — bottom-right. Populated from device_id.js below. -->
  <div class="version-tag" id="version-tag"></div>

  <!-- device_id.js is written by install.sh step 8 and by firstboot.sh.
       It assigns window.SKYTRACK_DEVICE_ID (and optionally _VERSION).
       Missing-file is tolerated — the pill keeps its placeholder text. -->
  <script src="device_id.js" onerror="void 0"></script>

  <script>
    (function () {
      "use strict";

      // ------------------------------------------------------------------
      // Configuration
      // ------------------------------------------------------------------
      var HEALTH_URL      = "http://127.0.0.1:8080/healthz";
      var KIOSK_URL       = "http://127.0.0.1:8080/kiosk";
      var POLL_MS         = 750;     // /healthz cadence
      var HTTP_TIMEOUT_MS = 1500;    // per-request timeout
      var UNAVAILABLE_MS  = 60000;   // cold-boot grace before switching video

      // ------------------------------------------------------------------
      // URL params — kiosk.js redirects here with ?from=kiosk when it
      // loses the backend at runtime and we want to jump straight to the
      // service-unavailable state instead of sitting on the boot video.
      // ------------------------------------------------------------------
      var queryStart = window.location.href.indexOf("?");
      var params = queryStart >= 0 ? window.location.href.substring(queryStart + 1) : "";
      var startedFromKiosk = /(^|&)from=kiosk(&|$)/.test(params);

      // ------------------------------------------------------------------
      // Device-ID pill population
      // ------------------------------------------------------------------
      var pillText = document.getElementById("device-pill-text");
      if (pillText && typeof window.SKYTRACK_DEVICE_ID === "string" && window.SKYTRACK_DEVICE_ID.length) {
        pillText.textContent = window.SKYTRACK_DEVICE_ID;
      }
      var versionTag = document.getElementById("version-tag");
      if (versionTag) {
        var v = (typeof window.SKYTRACK_VERSION === "string" && window.SKYTRACK_VERSION.length)
                ? window.SKYTRACK_VERSION
                : "";
        versionTag.textContent = v ? ("v" + v) : "";
      }

      // ------------------------------------------------------------------
      // State machine
      // ------------------------------------------------------------------
      var STATE_BOOT        = "boot";
      var STATE_SETUP       = "setup";
      var STATE_UNAVAILABLE = "unavailable";

      var videos = {};
      videos[STATE_BOOT]        = document.getElementById("video-boot");
      videos[STATE_SETUP]       = document.getElementById("video-setup");
      videos[STATE_UNAVAILABLE] = document.getElementById("video-unavailable");

      // Per-state broken flag. Flipped true by <video>.onerror or
      // <source>.onerror. Once broken, the state's video stays hidden
      // forever — we paint the fallback card instead.
      var videoBroken = {};
      videoBroken[STATE_BOOT]        = false;
      videoBroken[STATE_SETUP]       = false;
      videoBroken[STATE_UNAVAILABLE] = false;

      Object.keys(videos).forEach(function (s) {
        var v = videos[s];
        if (!v) { videoBroken[s] = true; return; }
        function markBroken() {
          if (videoBroken[s]) return;
          videoBroken[s] = true;
          if (state === s) applyState();
        }
        v.addEventListener("error", markBroken, false);
        var src = v.querySelector("source");
        if (src) src.addEventListener("error", markBroken, false);
      });

      var fallbackCard = document.getElementById("fallback-card");
      var fallbackMsg  = document.getElementById("fallback-msg");
      var fallbackDet  = document.getElementById("fallback-detail");

      var state       = startedFromKiosk ? STATE_UNAVAILABLE : STATE_BOOT;
      var startedAt   = Date.now();
      var pollCount   = 0;
      var redirecting = false;

      function setVisible(el, visible) {
        if (!el) return;
        if (visible) el.classList.add("visible");
        else el.classList.remove("visible");
      }

      function tryPlay(v) {
        if (!v) return;
        try {
          var p = v.play();
          if (p && typeof p.catch === "function") {
            p.catch(function () { /* ignored */ });
          }
        } catch (_e) { /* same */ }
      }

      function pauseVideo(v) {
        if (!v) return;
        try { v.pause(); } catch (_e) {}
      }

      function fallbackCopyFor(s) {
        if (s === STATE_SETUP) {
          return ["Setup required", "Open SkyTrack-Portal on a phone to continue"];
        }
        if (s === STATE_UNAVAILABLE) {
          return ["Service unavailable", "Waiting for backend to recover"];
        }
        return ["Starting services\u2026", "Attempt " + pollCount];
      }

      function applyState() {
        // 1. Hide and pause every video layer.
        Object.keys(videos).forEach(function (s) {
          setVisible(videos[s], false);
          pauseVideo(videos[s]);
        });

        // 2. Active video → visible + playing, fallback card hidden.
        var v = videos[state];
        if (v && !videoBroken[state]) {
          setVisible(v, true);
          tryPlay(v);
          setVisible(fallbackCard, false);
          return;
        }

        // 3. Active video is broken or missing → reveal the fallback
        //    card on top of the static branded gradient.
        var copy = fallbackCopyFor(state);
        if (fallbackMsg) fallbackMsg.textContent = copy[0];
        if (fallbackDet) fallbackDet.textContent = copy[1];
        setVisible(fallbackCard, true);
      }

      function gotoState(next) {
        if (state === next) return;
        state = next;
        applyState();
      }

      // ------------------------------------------------------------------
      // /healthz polling (runs in every state, forever, until we redirect)
      // ------------------------------------------------------------------
      function poll() {
        if (redirecting) return;
        pollCount += 1;
        if (fallbackCard.classList.contains("visible") && fallbackDet) {
          // Only update the fallback detail line if it's actually visible,
          // so we don't force layout thrash when the video is playing.
          var copy = fallbackCopyFor(state);
          fallbackMsg.textContent = copy[0];
          fallbackDet.textContent = copy[1];
        }

        var elapsed = Date.now() - startedAt;

        // Cold-boot grace: after UNAVAILABLE_MS of failure on the initial
        // boot state, switch to the service-unavailable video. Once we've
        // progressed past boot (setup/unavailable), leave state alone.
        if (state === STATE_BOOT && elapsed >= UNAVAILABLE_MS) {
          gotoState(STATE_UNAVAILABLE);
        }

        var controller = null;
        var timeoutId  = null;
        if (typeof AbortController === "function") {
          controller = new AbortController();
          timeoutId  = setTimeout(function () { controller.abort(); }, HTTP_TIMEOUT_MS);
        }

        var opts = { cache: "no-store" };
        if (controller) opts.signal = controller.signal;

        fetch(HEALTH_URL, opts)
          .then(function (r) {
            if (timeoutId) clearTimeout(timeoutId);
            if (!r || !r.ok) throw new Error("http " + (r ? r.status : "?"));
            return r.json().catch(function () { return {}; });
          })
          .then(function (_body) {
            // Backend is alive — hand off unconditionally to /kiosk. The
            // kiosk page owns every onboarding screen (boot_video,
            // setup_video, pin_required, pin_confirm, setup_offer,
            // setup_now_hotspot, operational) via /api/onboarding/state,
            // so the splash never needs to know whether the device is
            // already configured. Staying on the splash in the
            // unconfigured case (Phase 2 behavior) stranded the kiosk
            // at a looping setup video and never reached the PIN
            // keypad — Phase 3 moved that flow into /kiosk.
            redirecting = true;
            window.location.replace(KIOSK_URL);
            return;
          })
          .catch(function () {
            if (timeoutId) clearTimeout(timeoutId);
            // /healthz unreachable. Keep polling; the grace timer above
            // will flip us to the unavailable video at UNAVAILABLE_MS.
            setTimeout(poll, POLL_MS);
          });
      }

      // ------------------------------------------------------------------
      // Input lockdown — no right-click, no selection, no keyboard escape.
      // Chromium --kiosk blocks most of this already; belt-and-braces.
      // ------------------------------------------------------------------
      ["contextmenu", "dragstart", "selectstart", "gesturestart"].forEach(function (ev) {
        document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener("keydown", function (e) {
        var k = e.key;
        if (
          k === "F5" ||
          (e.ctrlKey && (k === "r" || k === "R" || k === "w" || k === "W" ||
                         k === "t" || k === "T" || k === "n" || k === "N" ||
                         k === "l" || k === "L"))
        ) {
          e.preventDefault();
        }
      });

      // ------------------------------------------------------------------
      // Boot
      // ------------------------------------------------------------------
      applyState();
      poll();
    })();
  </script>
</body>
</html>
