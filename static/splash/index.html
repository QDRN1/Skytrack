<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>SkyTrack</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #05070b;
      color: #e6ecf2;
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body { cursor: none; }

    #bg-video {
      position: fixed;
      top: 50%; left: 50%;
      min-width: 100%; min-height: 100%;
      width: auto; height: auto;
      transform: translate(-50%, -50%);
      z-index: 0;
      object-fit: cover;
      opacity: 0.85;
      pointer-events: none;
    }
    #scrim {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, rgba(5,7,11,0.35) 0%, rgba(5,7,11,0.85) 70%, #05070b 100%);
      z-index: 1;
    }

    .panel {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
      max-width: 720px;
      padding: 0 32px;
    }
    .brand {
      font-size: 54px;
      font-weight: 300;
      letter-spacing: 0.22em;
      margin: 0 0 12px 0;
      text-transform: uppercase;
    }
    .brand strong {
      font-weight: 600;
      color: #7ec8ff;
    }
    .tag {
      font-size: 16px;
      letter-spacing: 0.16em;
      color: #8aa0b8;
      text-transform: uppercase;
      margin: 0 0 40px 0;
    }

    .state { display: none; }
    .state.active { display: block; }

    .spinner {
      display: inline-block;
      width: 56px; height: 56px;
      border: 4px solid rgba(126, 200, 255, 0.18);
      border-top-color: #7ec8ff;
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
      margin: 12px 0 24px 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
      font-size: 20px;
      color: #c2cedb;
      margin: 0;
      line-height: 1.5;
    }
    .msg.small {
      font-size: 14px;
      color: #6f8397;
      margin-top: 12px;
      letter-spacing: 0.04em;
    }

    #state-unavailable .icon {
      font-size: 48px;
      margin-bottom: 16px;
      color: #f3a94a;
      font-weight: 300;
    }
    #state-unavailable .msg strong {
      color: #f3a94a;
      font-weight: 600;
    }
    .hint {
      margin-top: 28px;
      padding: 14px 22px;
      display: inline-block;
      border: 1px solid rgba(126, 200, 255, 0.25);
      border-radius: 8px;
      color: #8aa0b8;
      font-size: 14px;
      letter-spacing: 0.04em;
      background: rgba(10, 18, 28, 0.55);
    }
    .hint code {
      color: #7ec8ff;
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="file:///opt/skytrack/static/video/SkyTrack%20Boot%20Screen-V1.mp4" type="video/mp4">
  </video>
  <div id="scrim"></div>

  <div class="panel">
    <h1 class="brand">Sky<strong>Track</strong></h1>
    <p class="tag">ADS-B Tracker · QDRN</p>

    <div id="state-loading" class="state active">
      <div class="spinner" aria-hidden="true"></div>
      <p class="msg">Starting services…</p>
      <p class="msg small" id="loading-detail">Initializing</p>
    </div>

    <div id="state-unavailable" class="state">
      <div class="icon">&#9888;</div>
      <p class="msg"><strong>Service not ready</strong></p>
      <p class="msg small">SkyTrack is waiting for the core service to start.</p>
      <p class="msg small">This screen will update automatically when it's available.</p>
      <div class="hint">
        Connect to <code>SkyTrack-Portal</code> Wi-Fi to complete setup
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var HEALTH_URL = "http://127.0.0.1:8080/healthz";
      var KIOSK_URL  = "http://127.0.0.1:8080/kiosk";

      // Poll cadence + unavailable-state threshold
      var POLL_MS          = 750;
      var UNAVAILABLE_MS   = 60000;   // 60s of failure = show unavailable
      var startedAt        = Date.now();
      var pollCount        = 0;

      var loading     = document.getElementById("state-loading");
      var unavailable = document.getElementById("state-unavailable");
      var detail      = document.getElementById("loading-detail");

      function showLoading() {
        loading.classList.add("active");
        unavailable.classList.remove("active");
      }
      function showUnavailable() {
        loading.classList.remove("active");
        unavailable.classList.add("active");
      }

      function poll() {
        pollCount += 1;
        detail.textContent = "Attempt " + pollCount;

        var elapsed = Date.now() - startedAt;
        if (elapsed >= UNAVAILABLE_MS) showUnavailable();

        // AbortController to avoid piling up pending requests
        var controller = new AbortController();
        var t = setTimeout(function () { controller.abort(); }, 1500);

        fetch(HEALTH_URL, { cache: "no-store", signal: controller.signal })
          .then(function (r) {
            clearTimeout(t);
            if (!r.ok) throw new Error("http " + r.status);
            return r.json().catch(function () { return {}; });
          })
          .then(function () {
            // Healthy — hand off to the real kiosk route.
            window.location.replace(KIOSK_URL);
          })
          .catch(function () {
            clearTimeout(t);
            // Still unhealthy — stay on splash, poll again.
            // If we recover after showing unavailable, bounce back to loading.
            if (elapsed < UNAVAILABLE_MS) showLoading();
            setTimeout(poll, POLL_MS);
          });
      }

      // Suppress context menu, drag, text selection, pinch/zoom
      ["contextmenu", "dragstart", "selectstart", "gesturestart"].forEach(function (ev) {
        document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener("keydown", function (e) {
        // Block F5/Ctrl-R/Ctrl-W/etc. — kiosk mode blocks most but belt-and-braces
        var k = e.key;
        if (k === "F5" || (e.ctrlKey && (k === "r" || k === "R" || k === "w" || k === "W" || k === "t" || k === "T" || k === "n" || k === "N" || k === "l" || k === "L"))) {
          e.preventDefault();
        }
      });

      // Kick off polling immediately
      poll();
    })();
  </script>
</body>
</html>
